<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>坦克大战 - HTML5</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">🛡️ 坦克大战</h1>

  <div id="wrap">
    <div id="stage">
      <canvas id="game" width="640" height="640"></canvas>
      <div id="overlay"></div>
    </div>

    <div id="panel">
      <div class="stat"><span>得分</span><b id="score">0</b></div>
      <div class="stat"><span>关卡</span><b id="level">1</b></div>
      <div class="stat"><span>生命</span><b id="lives">3</b></div>
      <div class="stat"><span>剩余敌人</span><b id="enemies">0</b></div>

      <div class="help">
        <h2>操作说明</h2>
        <p><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> 移动</p>
        <p><kbd>空格</kbd> / <kbd>J</kbd> 射击</p>
        <p><kbd>P</kbd> 暂停　<kbd>Enter</kbd> 开始</p>
        <p><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 选择强化</p>
      </div>

      <div class="help">
        <h2>已获强化</h2>
        <p id="buffs">暂无</p>
      </div>

      <div class="tip">
        <h2>游戏规则</h2>
        <p>🌟 保护金色基地，消灭所有敌方坦克即可过关，共 5 关。</p>
        <p>🎱 炮弹会在墙壁间反弹（最多 4 次）直到击中坦克——小心流弹，敌人的炮弹也会误伤它们自己！</p>
        <p>🎁 每关通过后三选一强化：穿透弹、爆破弹、冰冻弹、射速、生命……</p>
        <p>👾 敌人逐关增强：更快、更准、双连发，还有精英坦克，最终关 BOSS 压轴！</p>
      </div>
    </div>
  </div>

  <footer>HTML5 Canvas 纯手写实现 · 无任何依赖</footer>

  <script src="game.js"></script>
</body>
</html>
